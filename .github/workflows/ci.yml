name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned to the toolchain docs/VERIFICATION.md records the measurements against. It must be
  # new enough that the cargo bundled with platform-tools can parse edition2024 manifests, which
  # transitive dependencies in Cargo.lock now use; 2.2.x ships cargo 1.84 and cannot.
  SOLANA_VERSION: "4.1.1"

jobs:
  program:
    name: program (fmt, clippy, host + SBF tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup component add rustfmt clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --all -- --check
      - run: cargo metadata --locked --format-version 1 > /dev/null

      # The lib is the deployed artifact and is kept warning-clean. Test code is allowed
      # arity warnings on builders, so it is linted without -D.
      - run: cargo clippy -p token-2022-receive --lib -- -D warnings
      - run: cargo clippy -p token-2022-receive --all-targets

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # LiteSVM suites load target/deploy/token_2022_receive.so, so this must come first.
      # --locked: build the committed dependency graph, not whatever resolves today.
      - run: cargo build-sbf --manifest-path program/token-2022-receive/Cargo.toml -- --locked

      - run: cargo test -p token-2022-receive --locked --no-fail-fast

      - name: Compute budget report
        run: cargo test -p token-2022-receive --test cu_ceilings -- --nocapture

  client:
    name: js client (typecheck + wire vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Codama output uses TypeScript enums; tests run under tsx.
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            clients/js/package-lock.json
      - name: Codama codegen freshness
        run: |
          npm ci
          npm run codegen:check
      - name: Client typecheck + tests
        working-directory: clients/js
        run: |
          npm ci
          npm run typecheck
          npm test
