<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 932 632" width="932" height="632" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717A"/>
    </marker>
    <style>
      .b  { rx:8; stroke-width:1.5; }
      .n  { fill:#F4F4F5; stroke:#A1A1AA; }
      .q  { fill:#FFFFFF; stroke:#71717A; stroke-dasharray:5 3; }
      .ok { fill:#DCFCE7; stroke:#16A34A; }
      .hd { fill:#FEF3C7; stroke:#D97706; }
      .no { fill:#FEE2E2; stroke:#DC2626; }
      .t  { font-size:14px; fill:#18181B; }
      .ts { font-size:12px; fill:#3F3F46; }
      .lb { font-size:12px; fill:#71717A; }
      .h  { font-size:14px; font-weight:600; }
      .l  { stroke:#71717A; stroke-width:1.5; fill:none; marker-end:url(#a); }
    </style>
  </defs>

  <rect x="300" y="20" width="300" height="44" class="b n"/>
  <text x="450" y="47" text-anchor="middle" class="t">Sender resolves receive terms</text>

  <path class="l" d="M450,64 L450,104"/>

  <rect x="330" y="104" width="240" height="44" class="b q"/>
  <text x="450" y="131" text-anchor="middle" class="t">Terms published?</text>

  <path class="l" d="M330,126 L185,126 L185,192"/>
  <text x="258" y="118" text-anchor="middle" class="lb">no</text>
  <rect x="60" y="192" width="250" height="44" class="b n"/>
  <text x="185" y="219" text-anchor="middle" class="t">Ordinary transfer</text>

  <path class="l" d="M450,148 L450,192"/>
  <text x="466" y="174" class="lb">yes</text>

  <rect x="340" y="192" width="290" height="44" class="b n"/>
  <text x="485" y="219" text-anchor="middle" class="t">policy_program.can_credit</text>

  <path class="l" d="M400,236 L400,268 L150,268 L150,330"/>
  <path class="l" d="M485,236 L485,330"/>
  <path class="l" d="M570,236 L570,268 L780,268 L780,330"/>

  <rect x="30" y="330" width="240" height="74" class="b ok"/>
  <text x="150" y="357" text-anchor="middle" class="t h">credited</text>
  <text x="150" y="379" text-anchor="middle" class="ts">source to destination</text>
  <text x="150" y="395" text-anchor="middle" class="ts">balance increases</text>

  <rect x="365" y="330" width="240" height="74" class="b hd"/>
  <text x="485" y="357" text-anchor="middle" class="t h">held</text>
  <text x="485" y="379" text-anchor="middle" class="ts">source to guard, receipt written</text>
  <text x="485" y="395" text-anchor="middle" class="ts">destination unchanged</text>

  <rect x="675" y="330" width="205" height="74" class="b no"/>
  <text x="777" y="357" text-anchor="middle" class="t h">failed</text>
  <text x="777" y="379" text-anchor="middle" class="ts">transaction reverts</text>
  <text x="777" y="395" text-anchor="middle" class="ts">nothing moved</text>

  <text x="255" y="310" text-anchor="middle" class="lb">accept</text>
  <text x="485" y="310" text-anchor="middle" class="lb">refuse, holds permitted</text>
  <text x="722" y="310" text-anchor="middle" class="lb">refuse, never_hold</text>

  <path class="l" d="M425,404 L425,440 L280,440 L280,488"/>
  <path class="l" d="M545,404 L545,440 L680,440 L680,488"/>
  <text x="485" y="432" text-anchor="middle" class="lb">recovery</text>

  <rect x="130" y="488" width="300" height="76" class="b n"/>
  <text x="280" y="514" text-anchor="middle" class="t h">ClaimReceipt</text>
  <text x="280" y="536" text-anchor="middle" class="ts">recovery authority, after one slot</text>
  <text x="280" y="553" text-anchor="middle" class="ts">claim destination is itself checked</text>

  <rect x="530" y="488" width="330" height="76" class="b n"/>
  <text x="695" y="514" text-anchor="middle" class="t h">CloseExpiredReceipt</text>
  <text x="695" y="536" text-anchor="middle" class="ts">permissionless, after TTL</text>
  <text x="695" y="553" text-anchor="middle" class="ts">refunds receipt.source_token_account</text>
</svg>
