[package]
name = "token-2022-receive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Token-2022-shaped reference program with destination receive-policy held delivery"
readme = "README.md"

[lib]
crate-type = ["cdylib", "lib"]

# The solana entrypoint! macro expands to cfgs this crate never sets. Declaring them as
# expected keeps `-D warnings` meaningful instead of blanket-allowing the whole lint.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
]

[features]
no-entrypoint = []
default = []

[dependencies]
arrayref = { workspace = true }
bytemuck = { workspace = true }
num_enum = { workspace = true }
solana-program = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
litesvm = "0.6.1"
solana-program = { workspace = true }
solana-sdk = "2.2"
